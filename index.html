<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <meta name="application-name" content="新加坡小旅行" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="新加坡小旅行" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>2026 新加坡親子旅行</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/app-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=20260804-planner-v11" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header" aria-label="新加坡小旅行">
        <div class="brand-mark" aria-hidden="true">
          <i data-lucide="map"></i>
        </div>
        <strong>新加坡小旅行</strong>
      </header>

      <nav class="day-tabs" aria-label="每日行程切換"></nav>

      <section class="day-panel" aria-live="polite"></section>

      <section class="quick-tools" aria-label="旅行工具">
        <button class="tool is-active" data-view="summary">
          <i data-lucide="route"></i>
          <span>行程</span>
        </button>
        <button class="tool" data-view="map">
          <i data-lucide="map-pinned"></i>
          <span>地圖</span>
        </button>
        <button class="tool" data-view="guide">
          <i data-lucide="book-open-check"></i>
          <span>指南</span>
        </button>
        <button class="tool" data-view="tools">
          <i data-lucide="wrench"></i>
          <span>工具</span>
        </button>
      </section>

      <section class="info-panel" aria-live="polite"></section>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./app.js?v=20260804-planner-v11"></script>
  </body>
</html>
